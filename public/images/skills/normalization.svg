<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central Database Normalization Graphic (Split/Organize Tables Concept) -->
    <g transform="translate(56, 85)">
      <!-- Unnormalized / Messy Large Table (Top) -->
      <g transform="translate(52, 10)">
        <rect x="0" y="0" width="168" height="56" rx="8" fill="#FB7185" stroke="#0F172A" stroke-width="3.5"/>
        <line x1="0" y1="20" x2="168" y2="20" stroke="#0F172A" stroke-width="3"/>
        <line x1="56" y1="20" x2="56" y2="56" stroke="#0F172A" stroke-width="2.5"/>
        <line x1="112" y1="20" x2="112" y2="56" stroke="#0F172A" stroke-width="2.5"/>
        <!-- Dots representing messy unnormalized data -->
        <circle cx="28" cy="10" r="4" fill="#0F172A"/>
        <circle cx="28" cy="38" r="3" fill="#0F172A"/>
        <circle cx="84" cy="38" r="3" fill="#0F172A"/>
        <circle cx="140" cy="38" r="3" fill="#0F172A"/>
      </g>

      <!-- Splitting / Normalization Flow Arrows -->
      <g transform="translate(136, 82)">
        <path d="M 0 0 L -24 32 M 0 0 L 24 32" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
        <polygon points="-24,32 -32,24 -16,22" fill="#0F172A"/>
        <polygon points="24,32 16,22 32,24" fill="#0F172A"/>
      </g>

      <!-- Normalized Tables 1 & 2 (Bottom Row) -->
      <!-- Table A (Left) -->
      <g transform="translate(36, 134)">
        <rect x="0" y="0" width="100" height="76" rx="8" fill="#2DD4BF" stroke="#0F172A" stroke-width="3.5"/>
        <line x1="0" y1="24" x2="100" y2="24" stroke="#0F172A" stroke-width="3"/>
        <line x1="50" y1="24" x2="50" y2="76" stroke="#0F172A" stroke-width="2.5"/>
        <circle cx="25" cy="12" r="3.5" fill="#0F172A"/>
        <circle cx="25" cy="46" r="3" fill="#0F172A"/>
        <circle cx="75" cy="46" r="3" fill="#0F172A"/>
        <circle cx="25" cy="62" r="3" fill="#0F172A"/>
      </g>

      <!-- Table B (Right) -->
      <g transform="translate(136, 134)">
        <rect x="0" y="0" width="100" height="76" rx="8" fill="#38BDF8" stroke="#0F172A" stroke-width="3.5"/>
        <line x1="0" y1="24" x2="100" y2="24" stroke="#0F172A" stroke-width="3"/>
        <line x1="50" y1="24" x2="50" y2="76" stroke="#0F172A" stroke-width="2.5"/>
        <circle cx="25" cy="12" r="3.5" fill="#0F172A"/>
        <circle cx="25" cy="46" r="3" fill="#0F172A"/>
        <circle cx="75" cy="46" r="3" fill="#0F172A"/>
        <circle cx="25" cy="62" r="3" fill="#0F172A"/>
      </g>

      <!-- Connection Key Badge in Center -->
      <g transform="translate(136, 126)">
        <rect x="-16" y="-12" width="32" height="24" rx="6" fill="#FBBF24" stroke="#0F172A" stroke-width="3"/>
        <path d="M -5 -2 L 0 3 L 5 -2" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
