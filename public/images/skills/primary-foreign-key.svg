<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central Primary & Foreign Key Graphic (Relational Database Tables & Connection) -->
    <g transform="translate(48, 85)">
      <!-- Table 1 (Primary Key Table) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="120" height="150" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
        <path d="M 0 32 H 120" stroke="#0F172A" stroke-width="3"/>
        <circle cx="16" cy="16" r="4" fill="#FBBF24"/>
        <circle cx="32" cy="16" r="4" fill="#38BDF8"/>
        <!-- PK Row Highlight -->
        <rect x="8" y="44" width="104" height="28" rx="4" fill="#FEF3C7" stroke="#FBBF24" stroke-width="2"/>
        <!-- Key Icon inside PK -->
        <g transform="translate(14, 52) scale(0.7)">
          <circle cx="8" cy="8" r="6" fill="none" stroke="#D97706" stroke-width="3"/>
          <path d="M 13 13 L 22 22 M 19 19 L 21 17 M 17 21 L 19 19" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
        </g>
        <rect x="44" y="52" width="56" height="12" rx="3" fill="#D97706"/>
        <!-- Other rows -->
        <rect x="14" y="86" width="70" height="10" rx="3" fill="#CBD5E1"/>
        <rect x="14" y="112" width="50" height="10" rx="3" fill="#CBD5E1"/>
      </g>

      <!-- Connecting Relational Line with Arrow/Diamond -->
      <path d="M 120 75 H 170 V 135 H 220" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>
      <!-- Connection Node / Link Pin -->
      <circle cx="170" cy="135" r="8" fill="#38BDF8" stroke="#0F172A" stroke-width="3"/>

      <!-- Table 2 (Foreign Key Table) -->
      <g transform="translate(200, 75)">
        <rect x="0" y="0" width="120" height="150" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
        <path d="M 0 32 H 120" stroke="#0F172A" stroke-width="3"/>
        <circle cx="16" cy="16" r="4" fill="#FBBF24"/>
        <circle cx="32" cy="16" r="4" fill="#38BDF8"/>
        <!-- Other rows -->
        <rect x="14" y="48" width="80" height="10" rx="3" fill="#CBD5E1"/>
        <!-- FK Row Highlight -->
        <rect x="8" y="72" width="104" height="28" rx="4" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2"/>
        <!-- Link/Key Icon inside FK -->
        <g transform="translate(14, 80) scale(0.7)">
          <path d="M 6 14 C 3 14 1 12 1 9 C 1 6 3 4 6 4 H 11 V 7 H 6 C 4.5 7 4 8 4 9 C 4 10 4.5 11 6 11 H 11 V 14 H 6 Z" fill="#0284C7"/>
          <path d="M 12 10 H 22" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
        </g>
        <rect x="44" y="80" width="60" height="12" rx="3" fill="#0284C7"/>
        <rect x="14" y="114" width="60" height="10" rx="3" fill="#CBD5E1"/>
      </g>
    </g>
  </g>
</svg>
