<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central CRUD Graphic (Database rows with Create, Read, Update, Delete action icons) -->
    <g transform="translate(48, 80)">
      <!-- Database Table Container -->
      <rect x="0" y="0" width="288" height="230" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
      
      <!-- Table Header Bar -->
      <path d="M 0 12 C 0 5.373 5.373 0 12 H 276 C 282.627 0 288 5.373 288 12 V 48 H 0 Z" fill="#0F172A"/>
      <circle cx="24" cy="24" r="5" fill="#38BDF8"/>
      <circle cx="44" cy="24" r="5" fill="#2DD4BF"/>
      <circle cx="64" cy="24" r="5" fill="#FBBF24"/>

      <!-- Row 1: Create (POST / Add) -->
      <g transform="translate(20, 68)">
        <rect x="0" y="4" width="120" height="12" rx="4" fill="#E2E8F0" stroke="#0F172A" stroke-width="2.5"/>
        <g transform="translate(204, 0)">
          <rect x="-36" y="-4" width="48" height="24" rx="6" fill="#34D399" stroke="#0F172A" stroke-width="3"/>
          <path d="M -16 8 H -8 M -12 4 V 12" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Row 2: Read (GET / View) -->
      <g transform="translate(20, 112)">
        <rect x="0" y="4" width="120" height="12" rx="4" fill="#E2E8F0" stroke="#0F172A" stroke-width="2.5"/>
        <g transform="translate(204, 0)">
          <rect x="-36" y="-4" width="48" height="24" rx="6" fill="#38BDF8" stroke="#0F172A" stroke-width="3"/>
          <circle cx="-16" cy="8" r="4" fill="none" stroke="#0F172A" stroke-width="2.5"/>
          <line x1="-13" y1="11" x2="-9" y2="15" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Row 3: Update (PUT / Edit) -->
      <g transform="translate(20, 156)">
        <rect x="0" y="4" width="120" height="12" rx="4" fill="#E2E8F0" stroke="#0F172A" stroke-width="2.5"/>
        <g transform="translate(204, 0)">
          <rect x="-36" y="-4" width="48" height="24" rx="6" fill="#FBBF24" stroke="#0F172A" stroke-width="3"/>
          <path d="M -16 12 L -16 10 L -10 4 L -8 6 L -14 12 Z" fill="#0F172A"/>
        </g>
      </g>

      <!-- Row 4: Delete (DELETE / Trash) -->
      <g transform="translate(20, 200)">
        <rect x="0" y="4" width="120" height="12" rx="4" fill="#E2E8F0" stroke="#0F172A" stroke-width="2.5"/>
        <g transform="translate(204, 0)">
          <rect x="-36" y="-4" width="48" height="24" rx="6" fill="#FB7185" stroke="#0F172A" stroke-width="3"/>
          <path d="M -18 5 H -6 M -16 5 V 13 C -16 13.5 -15.5 14 -15 14 H -9 C -8.5 14 -8 13.5 -8 13 V 5 M -13 3 H -11" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>
