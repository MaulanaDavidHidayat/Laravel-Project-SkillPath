<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central Design System Graphic (Color Swatches, Typography 'Aa' Glyph, and Component Library) -->
    <g transform="translate(64, 85)">
      <!-- Main Container Board -->
      <rect x="16" y="20" width="224" height="230" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>

      <!-- Section 1: Color Palette Swatches (Top Row) -->
      <g transform="translate(36, 40)">
        <rect x="0" y="0" width="36" height="36" rx="8" fill="#FB7185" stroke="#0F172A" stroke-width="3"/>
        <rect x="44" y="0" width="36" height="36" rx="8" fill="#38BDF8" stroke="#0F172A" stroke-width="3"/>
        <rect x="88" y="0" width="36" height="36" rx="8" fill="#FBBF24" stroke="#0F172A" stroke-width="3"/>
        <rect x="132" y="0" width="36" height="36" rx="8" fill="#2DD4BF" stroke="#0F172A" stroke-width="3"/>
      </g>

      <!-- Section 2: Typography Card / Glyph Box -->
      <g transform="translate(36, 92)">
        <rect x="0" y="0" width="84" height="64" rx="8" fill="#F1F5F9" stroke="#0F172A" stroke-width="3"/>
        <!-- Styled Typography 'Aa' -->
        <text x="42" y="44" font-family="system-ui, sans-serif" font-weight="800" font-size="32" fill="#0F172A" text-anchor="middle">Aa</text>
      </g>

      <!-- Section 3: Component / Button Library Tile -->
      <g transform="translate(132, 92)">
        <rect x="0" y="0" width="84" height="64" rx="8" fill="#818CF8" stroke="#0F172A" stroke-width="3"/>
        <rect x="16" y="22" width="52" height="20" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
        <circle cx="28" cy="32" r="4" fill="#0F172A"/>
      </g>

      <!-- Section 4: Grid / Layout Tokens Row -->
      <g transform="translate(36, 170)">
        <rect x="0" y="0" width="180" height="40" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="3" stroke-dasharray="6 4"/>
        <text x="90" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#64748B" text-anchor="middle">Design Tokens &amp; Grid</text>
      </g>
    </g>
  </g>
</svg>
