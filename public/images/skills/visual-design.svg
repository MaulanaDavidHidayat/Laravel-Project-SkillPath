<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central Visual Design Graphic (Color Palette, Swatches & Art Tools) -->
    <g transform="translate(64, 85)">
      <!-- Main Canvas / Artboard -->
      <rect x="24" y="20" width="200" height="230" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>

      <!-- Creative Shapes / Artwork on Canvas -->
      <!-- Abstract Circle -->
      <circle cx="84" cy="80" r="32" fill="#38BDF8" stroke="#0F172A" stroke-width="3.5"/>
      <!-- Abstract Triangle / Polygon -->
      <polygon points="150,50 190,110 110,110" fill="#FBBF24" stroke="#0F172A" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Abstract Rounded Rectangle / Card -->
      <rect x="70" y="130" width="100" height="40" rx="8" fill="#2DD4BF" stroke="#0F172A" stroke-width="3.5"/>

      <!-- Floating Color Swatches Palette / Pen Tool Overlapping -->
      <g transform="translate(160, 160)">
        <!-- Palette Base -->
        <rect x="-10" y="-10" width="80" height="80" rx="16" fill="#FB7185" stroke="#0F172A" stroke-width="4"/>
        <!-- Swatch Circles -->
        <circle cx="15" cy="15" r="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
        <circle cx="45" cy="15" r="10" fill="#FBBF24" stroke="#0F172A" stroke-width="3"/>
        <circle cx="15" cy="45" r="10" fill="#38BDF8" stroke="#0F172A" stroke-width="3"/>
        <circle cx="45" cy="45" r="10" fill="#0F172A" stroke="#0F172A" stroke-width="3"/>
      </g>
    </g>
  </g>
</svg>
