<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central Color Theory Graphic (Color Wheel / Palette Harmonization) -->
    <g transform="translate(192, 192)">
      <!-- Outer Connecting Ring -->
      <circle cx="0" cy="0" r="110" fill="none" stroke="#CBD5E1" stroke-width="4" stroke-dasharray="8 8"/>
      <circle cx="0" cy="0" r="75" fill="none" stroke="#0F172A" stroke-width="4"/>

      <!-- Center Eyedropper / Mixing Indicator -->
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
      
      <!-- Palette Swatch Nodes (6 Color Wheel Segments) -->
      <!-- 1. Red/Coral (Top) -->
      <g transform="translate(0, -75)">
        <circle cx="0" cy="0" r="22" fill="#FB7185" stroke="#0F172A" stroke-width="4"/>
      </g>

      <!-- 2. Orange/Yellow (Top Right) -->
      <g transform="translate(65, -37.5)">
        <circle cx="0" cy="0" r="22" fill="#FBBF24" stroke="#0F172A" stroke-width="4"/>
      </g>

      <!-- 3. Green/Teal (Bottom Right) -->
      <g transform="translate(65, 37.5)">
        <circle cx="0" cy="0" r="22" fill="#2DD4BF" stroke="#0F172A" stroke-width="4"/>
      </g>

      <!-- 4. Blue (Bottom) -->
      <g transform="translate(0, 75)">
        <circle cx="0" cy="0" r="22" fill="#38BDF8" stroke="#0F172A" stroke-width="4"/>
      </g>

      <!-- 5. Indigo/Purple (Bottom Left) -->
      <g transform="translate(-65, 37.5)">
        <circle cx="0" cy="0" r="22" fill="#818CF8" stroke="#0F172A" stroke-width="4"/>
      </g>

      <!-- 6. Pink/Magenta (Top Left) -->
      <g transform="translate(-65, -37.5)">
        <circle cx="0" cy="0" r="22" fill="#F472B6" stroke="#0F172A" stroke-width="4"/>
      </g>

      <!-- Center Core Icon (RGB/CMYK Mixer Symbol) -->
      <circle cx="0" cy="0" r="12" fill="#0F172A"/>
    </g>
  </g>
</svg>
