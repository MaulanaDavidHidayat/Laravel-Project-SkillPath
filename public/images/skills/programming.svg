<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Tech Slate & Indigo -->
    <linearGradient id="bgProgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Code Bracket / Element Gradient (Cyan to Blue) -->
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Accent Gradient (Emerald/Green for success/code output/fundamentals) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow -->
    <filter id="shadowProg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="116" ry="116" fill="url(#bgProgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Subtle Code Grid Lines in Background -->
  <g opacity="0.15">
    <line x1="64" y1="128" x2="448" y2="128" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="64" y1="256" x2="448" y2="256" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="64" y1="384" x2="448" y2="384" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="128" y1="64" x2="128" y2="448" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="256" y1="64" x2="256" y2="448" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="384" y1="64" x2="384" y2="448" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 8"/>
  </g>

  <!-- Main Central Programming Symbol Group -->
  <g filter="url(#shadowProg)">
    
    <!-- Code Window / Terminal Frame -->
    <rect x="96" y="112" width="320" height="288" rx="20" ry="20" fill="#090D16" stroke="#334155" stroke-width="4"/>
    
    <!-- Window Header / Controls -->
    <path d="M 96 132 Q 96 112 116 112 L 396 112 Q 416 112 416 132 L 416 160 L 96 160 Z" fill="#1E293B"/>
    <circle cx="128" cy="136" r="6" fill="#EF4444"/>
    <circle cx="148" cy="136" r="6" fill="#F59E0B"/>
    <circle cx="168" cy="136" r="6" fill="#10B981"/>

    <!-- Left Angle Bracket ( < ) -->
    <path d="M 190 200 L 130 256 L 190 312" 
          fill="none" stroke="url(#codeGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
    <path d="M 190 200 L 130 256 L 190 312" 
          fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Angle Bracket ( > ) -->
    <path d="M 322 200 L 382 256 L 322 312" 
          fill="none" stroke="url(#codeGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
    <path d="M 322 200 L 382 256 L 322 312" 
          fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Slash ( / ) representing code structure -->
    <path d="M 280 190 L 232 322" 
          fill="none" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round" filter="url(#neonGlow)"/>
    <path d="M 280 190 L 232 322" 
          fill="none" stroke="#A7F3D0" stroke-width="8" stroke-linecap="round"/>

    <!-- Terminal Prompt / Cursor Accent ( _ ) -->
    <rect x="235" y="340" width="36" height="8" rx="4" fill="#38BDF8"/>
  </g>
</svg>
