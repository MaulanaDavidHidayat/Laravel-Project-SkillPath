<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central UI/UX Fundamentals Graphic (Wireframe Layout & Design Tools) -->
    <g transform="translate(64, 85)">
      <!-- Main Wireframe Canvas -->
      <rect x="16" y="20" width="224" height="230" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
      
      <!-- Header Bar inside wireframe -->
      <rect x="36" y="40" width="100" height="16" rx="4" fill="#38BDF8" stroke="#0F172A" stroke-width="3"/>
      
      <!-- Image Placeholder Box with Diagonal Cross -->
      <rect x="36" y="72" width="92" height="72" rx="6" fill="#F1F5F9" stroke="#0F172A" stroke-width="3"/>
      <line x1="36" y1="72" x2="128" y2="144" stroke="#CBD5E1" stroke-width="2.5"/>
      <line x1="128" y1="72" x2="36" y2="144" stroke="#CBD5E1" stroke-width="2.5"/>

      <!-- Text Lines Placeholders -->
      <rect x="144" y="72" width="76" height="12" rx="4" fill="#FBBF24" stroke="#0F172A" stroke-width="3"/>
      <rect x="144" y="94" width="60" height="10" rx="3" fill="#CBD5E1" stroke="#0F172A" stroke-width="2.5"/>
      <rect x="144" y="114" width="68" height="10" rx="3" fill="#CBD5E1" stroke="#0F172A" stroke-width="2.5"/>

      <!-- Card / Component Elements Row -->
      <rect x="36" y="160" width="84" height="64" rx="6" fill="#2DD4BF" stroke="#0F172A" stroke-width="3"/>
      <rect x="136" y="160" width="84" height="64" rx="6" fill="#FB7185" stroke="#0F172A" stroke-width="3"/>

      <!-- Floating Design Cursor / Pen Tool Overlay -->
      <g transform="translate(200, 180)">
        <polygon points="0,0 0,36 10,26 22,36 28,30 16,20 28,20" fill="#0F172A" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="22" cy="10" r="10" fill="#FBBF24" stroke="#0F172A" stroke-width="3"/>
      </g>
    </g>
  </g>
</svg>
