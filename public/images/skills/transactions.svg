<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central Transactions Graphic (Financial Card & Transfer Arrows) -->
    <g transform="translate(64, 90)">
      <!-- Credit Card Base -->
      <rect x="20" y="20" width="216" height="136" rx="16" fill="#3B82F6" stroke="#0F172A" stroke-width="4"/>
      
      <!-- Card Magnetic Strip / Top Dark Band -->
      <rect x="20" y="44" width="216" height="28" fill="#1E293B"/>

      <!-- Card Chip -->
      <rect x="42" y="88" width="36" height="28" rx="6" fill="#FBBF24" stroke="#0F172A" stroke-width="3"/>
      <line x1="42" y1="102" x2="78" y2="102" stroke="#0F172A" stroke-width="2.5"/>
      <line x1="60" y1="88" x2="60" y2="116" stroke="#0F172A" stroke-width="2.5"/>

      <!-- Card Number Dots / Line -->
      <circle cx="96" cy="102" r="4" fill="#FFFFFF"/>
      <circle cx="112" cy="102" r="4" fill="#FFFFFF"/>
      <circle cx="128" cy="102" r="4" fill="#FFFFFF"/>
      <circle cx="144" cy="102" r="4" fill="#FFFFFF"/>

      <!-- Floating Transaction Action Badge / Circle with Exchange Arrows -->
      <g transform="translate(180, 130)">
        <circle cx="0" cy="0" r="36" fill="#10B981" stroke="#0F172A" stroke-width="4"/>
        <!-- Up/Down Exchange / Transfer Arrows -->
        <path d="M -12 -4 L -4 -12 L 4 -4 M -4 -12 V 12" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 12 4 L 4 12 L -4 4 M 4 12 V -12" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Transaction List Items at the Bottom -->
      <g transform="translate(20, 180)">
        <rect x="0" y="0" width="216" height="42" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="3.5"/>
        <circle cx="24" cy="21" r="10" fill="#2DD4BF" stroke="#0F172A" stroke-width="2.5"/>
        <!-- Plus/Receive Icon inside small circle -->
        <path d="M 21 21 H 27 M 24 18 V 24" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Text Bar placeholders -->
        <rect x="46" y="14" width="80" height="8" rx="3" fill="#0F172A"/>
        <rect x="156" y="14" width="44" height="8" rx="3" fill="#10B981"/>
      </g>
    </g>
  </g>
</svg>
