<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central Wireframing Graphic (Blueprint / Sketch UI Blocks) -->
    <g transform="translate(56, 80)">
      <!-- Main Sketch Artboard -->
      <rect x="20" y="20" width="232" height="232" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
      
      <!-- Top Navigation Sketch Bar -->
      <rect x="40" y="40" width="192" height="28" rx="6" fill="#F1F5F9" stroke="#0F172A" stroke-width="3" stroke-dasharray="6 4"/>
      
      <!-- Hero Section Placeholder Block -->
      <rect x="40" y="80" width="112" height="96" rx="6" fill="#E2E8F0" stroke="#0F172A" stroke-width="3"/>
      <!-- Diagonal Cross inside Hero Box -->
      <line x1="40" y1="80" x2="152" y2="176" stroke="#94A3B8" stroke-width="2.5"/>
      <line x1="152" y1="80" x2="40" y2="176" stroke="#94A3B8" stroke-width="2.5"/>

      <!-- Content Text Lines Right -->
      <rect x="164" y="80" width="68" height="12" rx="4" fill="#38BDF8" stroke="#0F172A" stroke-width="3"/>
      <rect x="164" y="102" width="56" height="10" rx="3" fill="#CBD5E1" stroke="#0F172A" stroke-width="2.5"/>
      <rect x="164" y="122" width="64" height="10" rx="3" fill="#CBD5E1" stroke="#0F172A" stroke-width="2.5"/>
      <rect x="164" y="142" width="40" height="10" rx="3" fill="#FBBF24" stroke="#0F172A" stroke-width="2.5"/>

      <!-- Bottom Card Blocks -->
      <rect x="40" y="188" width="88" height="44" rx="6" fill="#2DD4BF" stroke="#0F172A" stroke-width="3"/>
      <rect x="144" y="188" width="88" height="44" rx="6" fill="#FB7185" stroke="#0F172A" stroke-width="3"/>

      <!-- Floating Pencil / Blueprint Indicator Tool -->
      <g transform="translate(200, 45)">
        <circle cx="16" cy="16" r="20" fill="#FBBF24" stroke="#0F172A" stroke-width="3"/>
        <!-- Pencil Icon -->
        <path d="M 10 22 L 14 22 L 22 14 L 18 10 L 10 18 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/>
        <path d="M 8 24 L 10 22 L 14 26 L 12 28 Z" fill="#0F172A"/>
      </g>
    </g>
  </g>
</svg>
