<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central Indexing Graphic (Database/Document Indexing with Magnifier and Ordered Tabs/Nodes) -->
    <g transform="translate(64, 85)">
      <!-- Document Stack / Database Stack -->
      <g transform="translate(24, 20)">
        <!-- Bottom Layer -->
        <rect x="0" y="130" width="160" height="40" rx="8" fill="#CBD5E1" stroke="#0F172A" stroke-width="3.5"/>
        <line x1="24" y1="150" x2="100" y2="150" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>

        <!-- Middle Layer -->
        <rect x="0" y="70" width="160" height="40" rx="8" fill="#38BDF8" stroke="#0F172A" stroke-width="3.5"/>
        <line x1="24" y1="90" x2="120" y2="90" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
        <circle cx="140" cy="90" r="5" fill="#0F172A"/>

        <!-- Top Layer (Highlighted Index Card) -->
        <rect x="0" y="10" width="160" height="40" rx="8" fill="#FBBF24" stroke="#0F172A" stroke-width="3.5"/>
        <line x1="24" y1="30" x2="100" y2="30" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
        <circle cx="140" cy="30" r="5" fill="#0F172A"/>
      </g>

      <!-- Connecting Index Lines / Pointers -->
      <path d="M 184 60 H 210 V 150 H 184" fill="none" stroke="#0F172A" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>

      <!-- Magnifying Glass (Searching & Indexing Concept) -->
      <g transform="translate(160, 110)">
        <!-- Glass Circle -->
        <circle cx="40" cy="40" r="32" fill="#2DD4BF" fill-opacity="0.3" stroke="#0F172A" stroke-width="4"/>
        <circle cx="40" cy="40" r="22" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
        <path d="M 32 40 L 40 48 L 52 32" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Handle -->
        <line x1="62" y1="62" x2="90" y2="90" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
        <circle cx="90" cy="90" r="3" fill="#0F172A"/>
      </g>
    </g>
  </g>
</svg>
