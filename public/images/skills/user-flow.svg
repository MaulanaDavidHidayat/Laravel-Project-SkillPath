<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central User Flow Graphic (Connected Screen Nodes & Journey Path) -->
    <g transform="translate(56, 95)">
      <!-- Connecting Path Arrows -->
      <path d="M 110 60 H 162" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>
      <path d="M 210 92 V 132 H 110 V 172" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="110,172 102,156 118,156" fill="#0F172A"/>

      <!-- Screen Node 1: Onboarding (Teal) -->
      <g transform="translate(60, 60)">
        <rect x="-36" y="-36" width="72" height="72" rx="12" fill="#2DD4BF" stroke="#0F172A" stroke-width="4"/>
        <!-- Mini UI lines inside -->
        <rect x="-24" y="-20" width="48" height="8" rx="3" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="0" cy="8" r="10" fill="#0F172A"/>
      </g>

      <!-- Screen Node 2: Profile / Decision (Yellow) -->
      <g transform="translate(210, 60)">
        <rect x="-36" y="-36" width="72" height="72" rx="12" fill="#FBBF24" stroke="#0F172A" stroke-width="4"/>
        <circle cx="0" cy="0" r="14" fill="#0F172A" stroke="#FFFFFF" stroke-width="3"/>
      </g>

      <!-- Screen Node 3: Checkout / Success (Coral/Pink) -->
      <g transform="translate(110, 204)">
        <rect x="-36" y="-36" width="72" height="72" rx="12" fill="#FB7185" stroke="#0F172A" stroke-width="4"/>
        <!-- Checkmark icon inside -->
        <path d="M -12 -2 L -4 6 L 12 -10" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Screen Node 4: User Destination (Sky Blue) -->
      <g transform="translate(210, 204)">
        <rect x="-36" y="-36" width="72" height="72" rx="12" fill="#38BDF8" stroke="#0F172A" stroke-width="4"/>
        <!-- User Icon -->
        <circle cx="0" cy="-6" r="10" fill="#0F172A"/>
        <path d="M -16 18 C -16 10 -8 8 0 8 C 8 8 16 10 16 18" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
      </g>

      <!-- Connecting path between Node 3 and Node 4 -->
      <path d="M 146 204 H 174" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>
    </g>
  </g>
</svg>
