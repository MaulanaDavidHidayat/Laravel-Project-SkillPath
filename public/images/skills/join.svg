<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central JOIN Graphic (Database Intersection / Venn Diagram / Connection) -->
    <g transform="translate(64, 80)">
      <!-- Left Circle / Table A -->
      <g transform="translate(110, 130)">
        <circle cx="0" cy="0" r="70" fill="#38BDF8" fill-opacity="0.25" stroke="#0F172A" stroke-width="4"/>
        <rect x="-35" y="-20" width="70" height="40" rx="8" fill="#38BDF8" stroke="#0F172A" stroke-width="3.5"/>
        <text x="0" y="5" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0F172A" text-anchor="middle">Table A</text>
      </g>

      <!-- Right Circle / Table B -->
      <g transform="translate(194, 130)">
        <circle cx="0" cy="0" r="70" fill="#F43F5E" fill-opacity="0.25" stroke="#0F172A" stroke-width="4"/>
        <rect x="-35" y="-20" width="70" height="40" rx="8" fill="#FB7185" stroke="#0F172A" stroke-width="3.5"/>
        <text x="0" y="5" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0F172A" text-anchor="middle">Table B</text>
      </g>

      <!-- Center Intersection Highlight (JOIN Area) -->
      <g transform="translate(152, 130)">
        <ellipse cx="0" cy="0" rx="28" ry="50" fill="#FBBF24" stroke="#0F172A" stroke-width="4"/>
        <!-- Link / Join Symbol in Center -->
        <path d="M -8 -4 C -8 -6.209 -6.209 -8 -4 -8 L 4 -8 C 6.209 -8 8 -6.209 8 -4 L 8 4 C 8 6.209 6.209 8 4 8 L -4 8 C -6.209 8 -8 6.209 -8 4 Z" fill="none" stroke="#0F172A" stroke-width="3.5"/>
      </g>

      <!-- Connection Indicator Badge -->
      <g transform="translate(152, 40)">
        <rect x="-48" y="-14" width="96" height="28" rx="14" fill="#2DD4BF" stroke="#0F172A" stroke-width="3.5"/>
        <text x="0" y="5" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0F172A" text-anchor="middle">INNER JOIN</text>
      </g>
    </g>
  </g>
</svg>
