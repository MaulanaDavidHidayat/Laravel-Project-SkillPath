<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central Accessibility Graphic (Universal Access / Person in Wheelchair & Assistive Elements) -->
    <g transform="translate(64, 85)">
      <!-- Background Badge Circle -->
      <circle cx="128" cy="120" r="88" fill="#F0FDFA" stroke="#2DD4BF" stroke-width="4"/>

      <!-- Accessibility / Universal Person Icon -->
      <g transform="translate(128, 120)">
        <!-- Head -->
        <circle cx="0" cy="-44" r="16" fill="#38BDF8" stroke="#0F172A" stroke-width="4"/>
        
        <!-- Wheelchair Outer Circle -->
        <path d="M -24 40 A 36 36 0 1 0 36 -12" fill="none" stroke="#F43F5E" stroke-width="6" stroke-linecap="round"/>
        
        <!-- Torso & Arms -->
        <path d="M 0 -24 V 16 M -20 -4 L 20 -4 M 0 16 L 24 36" fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Assistive Tech / Inclusion Floating Badges -->
      <g transform="translate(48, 56)">
        <circle cx="0" cy="0" r="20" fill="#FBBF24" stroke="#0F172A" stroke-width="3.5"/>
        <!-- Eye Indicator -->
        <path d="M -10 0 C -5 -8 5 -8 10 0 C 5 8 -5 8 -10 0 Z" fill="none" stroke="#0F172A" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="3.5" fill="#0F172A"/>
      </g>

      <g transform="translate(208, 184)">
        <circle cx="0" cy="0" r="20" fill="#34D399" stroke="#0F172A" stroke-width="3.5"/>
        <!-- Sound Wave Indicator -->
        <path d="M -4 -8 V 8 M 0 -12 V 12 M 4 -6 V 6" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
