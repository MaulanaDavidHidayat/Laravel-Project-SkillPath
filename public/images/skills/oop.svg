<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Sapphire & Violet for OOP theme -->
    <linearGradient id="bgOOPGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311059"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Node/Cube Color Gradients representing Objects / Classes -->
    <linearGradient id="primaryCube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <linearGradient id="secondaryCube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="accentCube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="oopGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="oopShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="116" ry="116" fill="url(#bgOOPGrad)" stroke="#4338CA" stroke-width="2"/>

  <!-- Subtle Blueprint Grid Lines -->
  <g opacity="0.1" stroke="#818CF8" stroke-width="1.5">
    <path d="M 64 256 H 448 M 256 64 V 448" stroke-dasharray="6 6"/>
    <circle cx="256" cy="256" r="160" fill="none"/>
  </g>

  <!-- Main OOP Graphical Elements (Objects & Inheritance/Composition Links) -->
  <g filter="url(#oopShadow)">

    <!-- Connection Lines / Inheritance / Polymorphism Paths -->
    <path d="M 256 160 L 160 310 M 256 160 L 352 310 M 190 310 H 322" 
          fill="none" stroke="#64748B" stroke-width="6" stroke-dasharray="8 6" opacity="0.7"/>

    <!-- Object 1 (Top Parent Class / Main Object) -->
    <g transform="translate(256, 130)">
      <!-- Outer Hexagon / Class Box Symbol -->
      <polygon points="0,-45 40,-20 40,30 0,55 -40,30 -40,-20" fill="url(#primaryCube)" stroke="#C4B5FD" stroke-width="3" filter="url(#oopGlow)"/>
      <!-- Inner symbol: Cube/Node core -->
      <circle cx="0" cy="5" r="14" fill="#FFFFFF"/>
      <circle cx="0" cy="5" r="6" fill="#4F46E5"/>
    </g>

    <!-- Object 2 (Bottom-Left Child Class / Instance A) -->
    <g transform="translate(160, 310)">
      <polygon points="0,-35 30,-15 30,25 0,40 -30,25 -30,-15" fill="url(#secondaryCube)" stroke="#BAE6FD" stroke-width="3"/>
      <!-- Method/Property Dots -->
      <circle cx="-8" cy="2" r="5" fill="#FFFFFF"/>
      <circle cx="8" cy="2" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Object 3 (Bottom-Right Child Class / Instance B) -->
    <g transform="translate(352, 310)">
      <polygon points="0,-35 30,-15 30,25 0,40 -30,25 -30,-15" fill="url(#accentCube)" stroke="#FECDD3" stroke-width="3"/>
      <!-- Method/Property Dots -->
      <circle cx="0" cy="5" r="6" fill="#FFFFFF"/>
    </g>

    <!-- Floating Encapsulation / Data Shield Badges -->
    <circle cx="256" cy="235" r="14" fill="#1E293B" stroke="#38BDF8" stroke-width="4" filter="url(#oopGlow)"/>
    <text x="256" y="241" font-family="monospace" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">{}</text>

  </g>
</svg>
