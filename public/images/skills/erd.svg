<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central ERD (Entity Relationship Diagram) Graphic -->
    <g transform="translate(56, 85)">
      <!-- Relationship Diamond (Center) -->
      <g transform="translate(136, 120)">
        <polygon points="0,-36 48,0 0,36 -48,0" fill="#FBBF24" stroke="#0F172A" stroke-width="4" stroke-linejoin="round"/>
        <text x="0" y="6" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0F172A" text-anchor="middle">has</text>
      </g>

      <!-- Connecting Lines (Relationships) -->
      <path d="M 96 120 H 88" fill="none" stroke="#0F172A" stroke-width="4"/>
      <path d="M 176 120 H 184" fill="none" stroke="#0F172A" stroke-width="4"/>

      <!-- Entity 1 (Left Box - Table / User) -->
      <g transform="translate(48, 120)">
        <rect x="-48" y="-36" width="96" height="72" rx="10" fill="#2DD4BF" stroke="#0F172A" stroke-width="4"/>
        <line x1="-48" y1="-8" x2="48" y2="-8" stroke="#0F172A" stroke-width="3"/>
        <text x="0" y="-18" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#0F172A" text-anchor="middle">User</text>
        <circle cx="-30" cy="18" r="4" fill="#0F172A"/>
        <line x1="-20" y1="18" x2="24" y2="18" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Entity 2 (Right Box - Table / Order) -->
      <g transform="translate(224, 120)">
        <rect x="-48" y="-36" width="96" height="72" rx="10" fill="#38BDF8" stroke="#0F172A" stroke-width="4"/>
        <line x1="-48" y1="-8" x2="48" y2="-8" stroke="#0F172A" stroke-width="3"/>
        <text x="0" y="-18" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#0F172A" text-anchor="middle">Order</text>
        <circle cx="-30" cy="18" r="4" fill="#0F172A"/>
        <line x1="-20" y1="18" x2="24" y2="18" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Cardinality / Floating Attribute Pill (Top) -->
      <g transform="translate(136, 36)">
        <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#FB7185" stroke="#0F172A" stroke-width="3.5"/>
        <text x="0" y="5" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0F172A" text-anchor="middle">1 : N</text>
      </g>
      <path d="M 136 52 V 84" fill="none" stroke="#0F172A" stroke-width="4" stroke-dasharray="4 4"/>
    </g>
  </g>
</svg>
