<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central Data Structures Graphic (Hierarchical Tree Structure) -->
    <g transform="translate(64, 95)">
      <!-- Connecting Edges / Branches -->
      <path d="M 128 40 V 80 H 64 V 120 M 128 80 H 192 V 120 M 64 160 V 200 H 32 V 230 M 64 200 H 96 V 230 M 192 160 V 200 H 160 V 230 M 192 200 H 224 V 230" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Root Node (Top) -->
      <g transform="translate(128, 40)">
        <rect x="-30" y="-20" width="60" height="40" rx="8" fill="#FBBF24" stroke="#0F172A" stroke-width="4"/>
        <circle cx="0" cy="0" r="5" fill="#0F172A"/>
      </g>

      <!-- Level 1 Nodes -->
      <g transform="translate(64, 140)">
        <rect x="-24" y="-20" width="48" height="40" rx="8" fill="#2DD4BF" stroke="#0F172A" stroke-width="4"/>
        <circle cx="0" cy="0" r="4" fill="#0F172A"/>
      </g>

      <g transform="translate(192, 140)">
        <rect x="-24" y="-20" width="48" height="40" rx="8" fill="#38BDF8" stroke="#0F172A" stroke-width="4"/>
        <circle cx="0" cy="0" r="4" fill="#0F172A"/>
      </g>

      <!-- Level 2 Leaf Nodes -->
      <g transform="translate(32, 230)">
        <rect x="-18" y="-14" width="36" height="28" rx="6" fill="#FB7185" stroke="#0F172A" stroke-width="3.5"/>
      </g>
      <g transform="translate(96, 230)">
        <rect x="-18" y="-14" width="36" height="28" rx="6" fill="#34D399" stroke="#0F172A" stroke-width="3.5"/>
      </g>
      <g transform="translate(160, 230)">
        <rect x="-18" y="-14" width="36" height="28" rx="6" fill="#818CF8" stroke="#0F172A" stroke-width="3.5"/>
      </g>
      <g transform="translate(224, 230)">
        <rect x="-18" y="-14" width="36" height="28" rx="6" fill="#FBBF24" stroke="#0F172A" stroke-width="3.5"/>
      </g>
    </g>
  </g>
</svg>
