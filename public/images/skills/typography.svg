<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central Typography Graphic (Stylized Letters 'Aa' with Guidelines & Font Tools) -->
    <g transform="translate(64, 85)">
      <!-- Main Canvas Card -->
      <rect x="16" y="20" width="224" height="230" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
      
      <!-- Baseline and Ascender/Descender Guide Lines -->
      <line x1="36" y1="75" x2="220" y2="75" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="36" y1="135" x2="220" y2="135" stroke="#38BDF8" stroke-width="2.5"/>
      <line x1="36" y1="185" x2="220" y2="185" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>

      <!-- Large Artistic Letter 'A' -->
      <path d="M 52 185 L 75 75 L 98 185 L 83 185 L 78 160 L 72 160 L 67 185 Z M 75 110 L 70 146 L 80 146 Z" fill="#2DD4BF" stroke="#0F172A" stroke-width="3.5" stroke-linejoin="round"/>

      <!-- Large Artistic Letter 'a' -->
      <path d="M 140 185 C 132 185 125 178 125 168 C 125 158 133 150 145 150 C 151 150 156 152 159 155 L 159 152 C 159 144 153 138 144 138 C 137 138 131 141 128 144 L 122 133 C 127 128 136 125 146 125 C 160 125 172 133 172 152 L 172 185 L 159 185 L 159 176 C 154 182 148 185 140 185 Z M 148 162 C 143 162 138 166 138 172 C 138 177 143 180 148 180 C 154 180 159 175 159 169 C 159 164 154 162 148 162 Z" fill="#FB7185" stroke="#0F172A" stroke-width="3.5" stroke-linejoin="round"/>

      <!-- Floating Tool / Glyph Selector Tag -->
      <g transform="translate(170, 42)">
        <rect x="0" y="0" width="40" height="28" rx="6" fill="#FBBF24" stroke="#0F172A" stroke-width="3"/>
        <text x="20" y="20" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#0F172A" text-anchor="middle">Tt</text>
      </g>

      <!-- Font Property Swatches at Bottom -->
      <g transform="translate(36, 204)">
        <rect x="0" y="0" width="28" height="10" rx="3" fill="#0F172A"/>
        <rect x="34" y="0" width="28" height="10" rx="3" fill="#38BDF8"/>
        <rect x="68" y="0" width="28" height="10" rx="3" fill="#FBBF24"/>
        <rect x="102" y="0" width="28" height="10" rx="3" fill="#CBD5E1"/>
      </g>
    </g>
  </g>
</svg>
