<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central Layout & Grid Graphic (Dashboard Grid System & Rulers) -->
    <g transform="translate(64, 85)">
      <!-- Outer Dashboard Frame -->
      <rect x="16" y="20" width="224" height="230" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
      
      <!-- Grid Construction Guides / Dashed Rulers -->
      <line x1="16" y1="72" x2="240" y2="72" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>
      <line x1="88" y1="20" x2="88" y2="250" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>
      <line x1="168" y1="20" x2="168" y2="250" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>

      <!-- Grid Cell 1: Top Hero Card -->
      <rect x="32" y="36" width="184" height="48" rx="6" fill="#FBBF24" stroke="#0F172A" stroke-width="3.5"/>
      <circle cx="52" cy="60" r="6" fill="#0F172A"/>
      <rect x="72" y="52" width="60" height="12" rx="4" fill="#0F172A"/>

      <!-- Grid Cell 2: Bottom Left Column -->
      <rect x="32" y="96" width="104" height="128" rx="6" fill="#2DD4BF" stroke="#0F172A" stroke-width="3.5"/>
      <rect x="48" y="116" width="72" height="10" rx="3" fill="#0F172A"/>
      <rect x="48" y="136" width="56" height="8" rx="2" fill="#0F172A" opacity="0.6"/>

      <!-- Grid Cell 3: Bottom Right Column -->
      <rect x="148" y="96" width="68" height="128" rx="6" fill="#FB7185" stroke="#0F172A" stroke-width="3.5"/>
      <circle cx="182" cy="130" r="14" fill="#0F172A" opacity="0.8"/>
    </g>
  </g>
</svg>
