<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central Algorithm Flowchart Graphic -->
    <g transform="translate(56, 80)">
      <!-- Connecting Lines / Edges -->
      <path d="M 136 60 V 100 H 96 V 140" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 136 100 H 180 V 140" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 136 180 V 220" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>

      <!-- Node 1: Start/Input (Rounded Pill) -->
      <rect x="96" y="20" width="80" height="40" rx="20" fill="#38BDF8" stroke="#0F172A" stroke-width="4"/>
      <text x="136" y="45" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#0F172A" text-anchor="middle">Input</text>

      <!-- Node 2: Decision (Diamond / Rhombus) -->
      <g transform="translate(136, 140)">
        <polygon points="0,-35 45,0 0,35 -45,0" fill="#FBBF24" stroke="#0F172A" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="0" cy="0" r="6" fill="#0F172A"/>
      </g>

      <!-- Node 3: Process A (Teal Box) -->
      <g transform="translate(76, 220)">
        <rect x="-40" y="-20" width="80" height="40" rx="8" fill="#2DD4BF" stroke="#0F172A" stroke-width="4"/>
        <text x="0" y="6" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#0F172A" text-anchor="middle">Sort()</text>
      </g>

      <!-- Node 4: Process B (Coral Box) -->
      <g transform="translate(196, 220)">
        <rect x="-40" y="-20" width="80" height="40" rx="8" fill="#FB7185" stroke="#0F172A" stroke-width="4"/>
        <text x="0" y="6" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#0F172A" text-anchor="middle">Search</text>
      </g>

      <!-- Terminal branching lines to bottom nodes -->
      <path d="M 136 175 L 76 200" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
      <path d="M 136 175 L 196 200" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>

      <!-- Small connection terminal dots -->
      <circle cx="136" cy="60" r="5" fill="#0F172A"/>
      <circle cx="136" cy="180" r="5" fill="#0F172A"/>
    </g>
  </g>
</svg>
