<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central Branding Graphic (Color Swatches, Fountain Pen / Nib, Brand Identity Elements) -->
    <g transform="translate(64, 85)">
      <!-- Background Swatch Card 1 -->
      <rect x="20" y="30" width="100" height="120" rx="12" fill="#F1F5F9" stroke="#0F172A" stroke-width="3.5" transform="rotate(-10 70 90)"/>
      
      <!-- Background Swatch Card 2 -->
      <rect x="120" y="30" width="100" height="120" rx="12" fill="#FEF3C7" stroke="#0F172A" stroke-width="3.5" transform="rotate(10 170 90)"/>

      <!-- Main Center Brand Identity Shield / Badge Card -->
      <rect x="62" y="40" width="132" height="150" rx="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
      
      <!-- Brand Logo Symbol Inside (Star/Diamond Gem inside a Badge) -->
      <polygon points="128,70 148,105 128,140 108,105" fill="#38BDF8" stroke="#0F172A" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="128" cy="105" r="8" fill="#FBBF24" stroke="#0F172A" stroke-width="3"/>

      <!-- Color Palette Circles at Bottom -->
      <circle cx="92" cy="216" r="14" fill="#2DD4BF" stroke="#0F172A" stroke-width="3.5"/>
      <circle cx="128" cy="216" r="14" fill="#FBBF24" stroke="#0F172A" stroke-width="3.5"/>
      <circle cx="164" cy="216" r="14" fill="#FB7185" stroke="#0F172A" stroke-width="3.5"/>

      <!-- Floating Design Pen / Nib Tool -->
      <g transform="translate(180, 150) rotate(45)">
        <path d="M 0 -24 C 12 -24 20 -10 20 10 L 10 24 C 6 20 0 10 -10 0 Z" fill="#F1F5F9" stroke="#0F172A" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M -10 0 L 0 24 L -10 32 Z" fill="#0F172A"/>
        <circle cx="5" cy="-5" r="3" fill="#0F172A"/>
      </g>
    </g>
  </g>
</svg>
