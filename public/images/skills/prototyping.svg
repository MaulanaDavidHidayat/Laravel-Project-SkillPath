<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central Prototyping Graphic (Interactive Mobile & Screen Frames with Interaction Flow Connection) -->
    <g transform="translate(56, 80)">
      <!-- Interaction Flow Connecting Arrow/Path -->
      <path d="M 110 120 C 130 120, 140 160, 170 160 C 200 160, 210 120, 230 120" fill="none" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 8"/>
      <polygon points="238,120 224,112 224,128" fill="#FBBF24"/>

      <!-- Screen Frame 1 (Left / Mobile Wireframe) -->
      <g transform="translate(30, 60)">
        <rect x="0" y="0" width="80" height="140" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
        <!-- Phone Notch / Speaker -->
        <rect x="25" y="8" width="30" height="4" rx="2" fill="#CBD5E1"/>
        <!-- Screen Content Elements -->
        <rect x="10" y="24" width="60" height="30" rx="6" fill="#38BDF8" stroke="#0F172A" stroke-width="3"/>
        <rect x="10" y="64" width="60" height="16" rx="4" fill="#F1F5F9" stroke="#0F172A" stroke-width="2.5"/>
        <rect x="10" y="88" width="40" height="12" rx="3" fill="#CBD5E1" stroke="#0F172A" stroke-width="2.5"/>
        <!-- Interactive Touch Point / Pulse Circle -->
        <circle cx="40" cy="115" r="10" fill="#FB7185" stroke="#0F172A" stroke-width="3"/>
        <circle cx="40" cy="115" r="16" fill="none" stroke="#FB7185" stroke-width="2" opacity="0.6"/>
      </g>

      <!-- Screen Frame 2 (Right / Result Modal / Screen) -->
      <g transform="translate(240, 60)">
        <rect x="0" y="0" width="84" height="140" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
        <!-- Screen Header -->
        <rect x="12" y="16" width="60" height="12" rx="4" fill="#2DD4BF" stroke="#0F172A" stroke-width="3"/>
        <!-- Card Body -->
        <rect x="12" y="38" width="60" height="84" rx="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="3"/>
        <line x1="20" y1="56" x2="64" y2="56" stroke="#CBD5E1" stroke-width="2.5"/>
        <line x1="20" y1="70" x2="52" y2="70" stroke="#CBD5E1" stroke-width="2.5"/>
        <rect x="20" y="86" width="44" height="24" rx="4" fill="#FBBF24" stroke="#0F172A" stroke-width="2.5"/>
      </g>
    </g>
  </g>
</svg>
