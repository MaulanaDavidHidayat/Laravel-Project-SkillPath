<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Background Card -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>

  <!-- Decorative Interface Window Header -->
  <g transform="translate(64, 64)">
    <!-- Window Frame -->
    <rect width="384" height="384" rx="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Top Bar -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 H 360 C 373.255 0 384 10.745 384 24 V 48 H 0 Z" fill="#F1F5F9"/>
    <line x1="0" y1="48" x2="384" y2="48" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Central Database Design Graphic (ERD / Relational DB cylinders & tables) -->
    <g transform="translate(72, 85)">
      <!-- Connecting Relationship Lines -->
      <path d="M 120 70 L 120 120 M 120 150 L 120 190 M 70 85 L 170 85" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-dasharray="6 6" stroke-linecap="round"/>

      <!-- Database Cylinder 1 (Top Center) -->
      <g transform="translate(120, 52)">
        <path d="M -36 -24 C -36 -31.73 -16.1 -38 0 -38 C 16.1 -38 36 -31.73 36 -24 V 24 C 36 31.73 16.1 38 0 38 C -16.1 38 -36 31.73 -36 24 Z" fill="#38BDF8" stroke="#0F172A" stroke-width="3.5"/>
        <ellipse cx="0" cy="-24" rx="36" ry="12" fill="#7DD3FC" stroke="#0F172A" stroke-width="3.5"/>
        <ellipse cx="0" cy="0" rx="36" ry="12" fill="none" stroke="#0F172A" stroke-width="3.5"/>
      </g>

      <!-- Database Cylinder / Table Left -->
      <g transform="translate(60, 200)">
        <rect x="-36" y="-20" width="72" height="64" rx="8" fill="#2DD4BF" stroke="#0F172A" stroke-width="3.5"/>
        <line x1="-36" y1="2" x2="36" y2="2" stroke="#0F172A" stroke-width="3"/>
        <circle cx="-18" cy="-8" r="4" fill="#0F172A"/>
        <circle cx="0" cy="-8" r="4" fill="#0F172A"/>
        <circle cx="18" cy="-8" r="4" fill="#0F172A"/>
      </g>

      <!-- Database Cylinder / Table Right -->
      <g transform="translate(180, 200)">
        <rect x="-36" y="-20" width="72" height="64" rx="8" fill="#FB7185" stroke="#0F172A" stroke-width="3.5"/>
        <line x1="-36" y1="2" x2="36" y2="2" stroke="#0F172A" stroke-width="3"/>
        <circle cx="-18" cy="-8" r="4" fill="#0F172A"/>
        <circle cx="0" cy="-8" r="4" fill="#0F172A"/>
        <circle cx="18" cy="-8" r="4" fill="#0F172A"/>
      </g>

      <!-- Central Connector / Config Gear -->
      <g transform="translate(120, 135)">
        <rect x="-18" y="-18" width="36" height="36" rx="8" fill="#FBBF24" stroke="#0F172A" stroke-width="3.5"/>
        <circle cx="0" cy="0" r="6" fill="#0F172A"/>
      </g>
    </g>
  </g>
</svg>
