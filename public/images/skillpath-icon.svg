<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- App Icon Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- S-Path 3D Gradients -->
    <linearGradient id="pathGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="30%" stop-color="#818CF8"/>
      <stop offset="70%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <linearGradient id="pathGradSide" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <!-- Cap Top Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Glow/Highlight -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="116" ry="116" fill="url(#bgGrad)"/>

  <!-- Inner Icon Group with Shadow -->
  <g filter="url(#shadow)" transform="translate(0, 5)">
    
    <!-- Bottom/Back Path Curve -->
    <path d="M190 380 C 140 380, 120 340, 150 310 C 170 290, 220 280, 260 260 C 310 235, 340 195, 330 150 C 320 120, 280 110, 250 125 C 220 140, 200 170, 185 200" 
          fill="none" stroke="url(#pathGradSide)" stroke-width="48" stroke-linecap="round"/>

    <!-- Main S-Path Ribbon 3D -->
    <path d="M 180 230 
             C 180 160, 240 120, 300 135
             C 330 143, 345 165, 345 190
             C 345 220, 310 245, 275 265
             C 215 295, 160 320, 175 370
             C 185 405, 225 415, 275 405
             C 315 395, 350 370, 370 335" 
          fill="none" stroke="url(#pathGradMain)" stroke-width="52" stroke-linecap="round"/>

    <!-- Foreground Ribbons / Highlights to create depth -->
    <path d="M 195 380 C 230 400, 270 395, 310 365" fill="none" stroke="#E0E7FF" stroke-width="20" stroke-linecap="round" opacity="0.4"/>
    <path d="M 230 145 C 265 135, 305 145, 325 170" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.6"/>

    <!-- Graduation Cap (Mortarboard) -->
    <!-- Cap Diamond Top -->
    <polygon points="256,100 370,145 256,190 142,145" fill="url(#capGrad)" stroke="#C7D2FE" stroke-width="2"/>
    
    <!-- Cap Under / Side Depth -->
    <path d="M 142 145 L 256 190 L 370 145 L 370 160 C 370 180, 256 220, 256 220 C 256 220, 142 180, 142 160 Z" fill="#312E81" opacity="0.7"/>

    <!-- Tassel -->
    <path d="M 185 160 L 175 195 C 173 200, 178 205, 183 203 L 188 201" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="183" cy="207" r="6" fill="#FBBF24"/>

    <!-- Floating Node / Glowing Orb -->
    <circle cx="335" cy="235" r="18" fill="url(#glow)"/>
    <circle cx="335" cy="235" r="8" fill="#FFFFFF"/>

  </g>
</svg>
